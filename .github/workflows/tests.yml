name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and unit tests
        run: |
          python3 -m compileall -q network_checker.py tests/
          python3 -m unittest discover -s tests -v
